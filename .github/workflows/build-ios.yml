name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
      xcode_version:
        description: Xcode version installed on macos-15 (blank uses the runner default or BOXEDVN_XCODE_VERSION)
        required: false
        default: ""
        type: string
  push:
    branches:
      - ios
      - main
      - master
    paths: &ios_build_paths
      - .github/workflows/build-ios.yml
      - CMakeLists.txt
      - CMakePresets.json
      - buildFlags.txt
      - cmake/**
      - include/**
      - ios/**
      - lib/**
      - platform/**
      - scripts/**
      - third_party/patches/dxvk-*.patch
      - source/**
      - THIRD_PARTY_NOTICES.md
  pull_request:
    branches:
      - ios
      - main
      - master
    paths: *ios_build_paths

permissions:
  contents: write

concurrency:
  group: build-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
  REQUESTED_XCODE: ${{ inputs.xcode_version || vars.BOXEDVN_XCODE_VERSION || '' }}

jobs:
  dxvk-i386:
    name: Build pinned 32-bit DXVK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Restore rebuilt DXVK modules
        id: dxvk-cache
        uses: actions/cache@v4
        with:
          path: build/dxvk-i386
          key: dxvk-i386-${{ runner.os }}-${{ hashFiles('scripts/dependencies.dxvk.lock.sh', 'scripts/build-dxvk-i386.sh', 'scripts/validate-dxvk-i386.py', 'scripts/test_dxvk_sampler_variants.py', 'third_party/patches/dxvk-*.patch') }}
      - name: Build DXVK with worker exception reports
        if: steps.dxvk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++-mingw-w64-i686-posix meson ninja-build glslang-tools python3-mako
          bash scripts/build-dxvk-i386.sh
      - name: Validate DXVK modules
        run: python3 scripts/validate-dxvk-i386.py build/dxvk-i386
      - uses: actions/upload-artifact@v7
        with:
          name: dxvk-i386
          path: build/dxvk-i386
          if-no-files-found: error
          retention-days: 14

  guest-probe:
    name: Build IA-32 graphics probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out BoxedVN
        uses: actions/checkout@v6

      - name: Install IA-32 PE compiler
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends g++-mingw-w64-i686

      - name: Build and validate graphics probe
        shell: bash
        run: |
          bash scripts/build-guest-graphics-probe.sh
          bash scripts/build-guest-fex64-probe.sh

      - name: Upload graphics probe
        uses: actions/upload-artifact@v7
        with:
          name: guest-graphics-probe
          path: |
            build/guest-probes/boxedvn-d3d9-cube.exe
            build/guest-probes/boxedvn-d3d9-cube.exe.sha256
            build/guest-probes/boxedvn-fex64-kernel-probe
            build/guest-probes/boxedvn-fex64-kernel-probe.sha256
          if-no-files-found: error
          retention-days: 14

  wine64-runtime:
    name: Build x86-64 Wine runtime layers
    needs: dxvk-i386
    runs-on: ubuntu-24.04
    # The i386 Wine package is 100 MB from the runner's Ubuntu mirror, which
    # served it at 110 kB/s on one run (15 minutes); the package is cached
    # below, but an uncached run still has to fit. The OSS driver step builds
    # Wine's own configure and one dll from source and is bounded at 25
    # minutes of that, so the job needs room for both worst cases at once.
    timeout-minutes: 130
    steps:
      - name: Check out BoxedVN
        uses: actions/checkout@v6

      - name: Download rebuilt 32-bit DXVK
        uses: actions/download-artifact@v7
        with:
          name: dxvk-i386
          path: build/dxvk-i386

      - name: Install Wine 11 build and runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential flex bison zip unzip curl xz-utils \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 libz-mingw-w64 oss4-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxrender-dev libxfixes-dev libxcomposite-dev libxxf86vm-dev \
            libfreetype-dev libfontconfig-dev libharfbuzz-dev libgnutls28-dev \
            libvulkan-dev libgl-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpng-dev libjpeg-dev libtiff-dev libmpg123-dev libopenal-dev \
            fontconfig fontconfig-config fonts-liberation fonts-wine

      - name: Restore matching Wine 11 runtime and audio modules
        id: wine11-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/wine11-install
            build/wine64-oss
          key: wine11-wow64-${{ runner.os }}-${{ hashFiles('scripts/build-wine11-runtime.sh', 'scripts/build-wine64-oss-driver.sh', 'scripts/wine-patches/**', 'scripts/test_faudio_callback_locks.py', 'scripts/test_wine_readonly_sections.py') }}

      - name: Build complete pinned Wine 11 WoW64 runtime
        if: steps.wine11-cache.outputs.cache-hit != 'true'
        timeout-minutes: 100
        shell: bash
        run: bash scripts/build-wine11-runtime.sh

      - name: Cache completed Wine 11 compilation
        if: steps.wine11-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/wine11-install
            build/wine64-oss
          key: ${{ steps.wine11-cache.outputs.cache-primary-key }}

      - name: Validate Wine server protocol against pinned private headers
        run: python3 scripts/test_wine_server_protocol.py --fetch-pinned-headers

      - name: Build and validate Wine64 layers
        shell: bash
        env:
          CI: true
        run: |
          set -euo pipefail
          bash scripts/build-boxedwine-dxmt-unixlib.sh build/winemetal.so
          # The guest X11 client libraries are validated against the very
          # winex11.so that gets packaged, so a Wine update that imports a
          # new Xlib symbol fails here rather than at the guest's dlopen.
          winex11="build/wine11-install/usr/lib/x86_64-linux-gnu/wine/x86_64-unix/winex11.so"
          test -n "${winex11}"
          bash scripts/build-boxedwine-x64-x11.sh \
            --output-dir build/x64-x11 \
            --winex11 "${winex11}"
          python3 scripts/test_x64_xinput.py build/x64-x11
          # Wine 11 moved Vulkan loading and procedure lookup into win32u.
          # Validate the shared presentation entry points against that exact
          # packaged module; winex11 now receives function pointers from it.
          bash scripts/build-boxedwine-x64-vulkan.sh \
            --output-dir build/x64-vulkan \
            --wine-vulkan-loader "${winex11%/winex11.so}/win32u.so"
          # The OSS driver is passed only when both halves are there. Half a
          # pair is a build failure in the runtime builder, by design: the PE
          # half reaches the unix half through Wine's private
          # __wine_unix_call boundary and cannot load without it.
          oss_args=()
          if [[ -s build/wine64-oss/wineoss.so && -s build/wine64-oss/wineoss.drv ]]; then
            oss_args=(--oss-driver-dir build/wine64-oss)
            echo "packaging Wine's OSS audio driver"
          else
            echo "no OSS audio driver was built; the runtime will carry no audio backend" >&2
          fi
          bash scripts/build-wine64-runtime-ci.sh \
            --output-dir build/wine64-runtime \
            --wine-install build/wine11-install \
            --dxmt-unixlib build/winemetal.so \
            --x11-shim-dir build/x64-x11 \
            --vulkan-shim build/x64-vulkan/libvulkan.so.1 \
            --dxvk-i386-dir build/dxvk-i386 \
            --i386-pe-dir build/wine11-install/usr/lib/x86_64-linux-gnu/wine/i386-windows \
            "${oss_args[@]+"${oss_args[@]}"}"
          BOXEDVN_REQUIRE_WINE64_OSS=1 bash scripts/validate-wine64-runtime.sh \
            --input build/wine64-runtime \
            --manifest build/wine64-runtime/wine64-runtime.manifest

      - name: Upload Wine64 runtime layers
        uses: actions/upload-artifact@v7
        with:
          name: wine64-runtime
          path: build/wine64-runtime
          if-no-files-found: error
          retention-days: 14

  x64-graphics-assets:
    name: Build x86-64 DXMT graphics resources
    runs-on: macos-15
    # The first uncached run builds Windows and iPhoneOS LLVM libraries.
    # Subsequent runs restore them from the pinned cache, but the initial build
    # needs enough room to finish instead of producing a misleading timeout.
    timeout-minutes: 300
    steps:
      - name: Check out BoxedVN
        uses: actions/checkout@v6

      - name: Install DXMT build tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user meson==1.10.0 --break-system-packages
          echo "$(python3 -m site --user-base)/bin" >> "${GITHUB_PATH}"

      - name: Restore DXMT cross-toolchain cache
        id: dxmt-toolchains-cache
        uses: actions/cache/restore@v5
        with:
          path: third_party/fex64/toolchains
          key: boxedvn-dxmt-toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-toolchains.sh') }}-${{ github.run_id }}
          restore-keys: |
            boxedvn-dxmt-toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-toolchains.sh') }}-
            boxedvn-dxmt-toolchains-${{ runner.os }}-${{ runner.arch }}-
            fex64-toolchains-${{ runner.os }}-

      - name: Restore pinned LLVM source cache
        id: dxmt-llvm-source-cache
        uses: actions/cache/restore@v5
        with:
          path: third_party/fex64/llvm-project
          key: boxedvn-dxmt-llvm-source-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh') }}
          restore-keys: |
            boxedvn-dxmt-llvm-source-${{ runner.os }}-
            fex64-llvm-src-${{ runner.os }}-

      - name: Fetch and verify DXMT build inputs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-fex64-dependencies.sh --component mythic
          bash scripts/prepare-dxmt-x64-dependencies.sh

      - name: Build and stage x86-64 DXMT resources
        shell: bash
        run: |
          set -euo pipefail
          source scripts/dependencies.fex64.lock.sh
          mingw="third_party/fex64/toolchains/llvm-mingw-${BOXEDVN_LLVM_MINGW_VERSION}-ucrt-macos-universal"
          wine_sdk="third_party/fex64/toolchains/wine-sdk"
          llvm="third_party/fex64/llvm-project"
          bash scripts/validate-boxedwine-dxmt-unixlib.sh
          bash scripts/build-dxmt-x64-pe.sh \
            --source third_party/fex64/dxmt \
            --toolchain "${mingw}" \
            --wine-install "${wine_sdk}" \
            --llvm-source "${llvm}" \
            --output-dir build/dxmt-pe
          bash scripts/build-fex64-toolchains.sh --stage llvm-ios
          bash scripts/build-dxmt-ios-native.sh
          bash scripts/build-x64-graphics-probe.sh \
            --toolchain "${mingw}" \
            --output build/guest-probes/boxedvn-d3d11-cube-x64.exe
          bash scripts/stage-x64-graphics-assets.sh \
            --probe build/guest-probes/boxedvn-d3d11-cube-x64.exe \
            --dxmt build/dxmt-pe \
            --native-archive third_party/fex64/dxmt-ios/libdxmt_combined.a \
            --output-dir build/x64-graphics

      - name: Upload x86-64 graphics resources
        uses: actions/upload-artifact@v7
        with:
          name: x64-graphics-assets
          path: build/x64-graphics
          if-no-files-found: error
          retention-days: 14

      - name: Validate D3D9 guest shader bridge
        run: python3 scripts/test_dxso_guest_bridge.py --source third_party/fex64/dxmt

      - name: Save DXMT cross-toolchain cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: third_party/fex64/toolchains
          key: boxedvn-dxmt-toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-toolchains.sh') }}-${{ github.run_id }}

      - name: Save pinned LLVM source cache
        if: always() && steps.dxmt-llvm-source-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: third_party/fex64/llvm-project
          key: boxedvn-dxmt-llvm-source-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh') }}

  tests:
    name: Host-independent tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out BoxedVN
        uses: actions/checkout@v6

      - name: Report tool versions
        shell: bash
        run: |
          cmake --version
          ninja --version
          c++ --version

      - name: Configure tests
        run: cmake --preset tests-only

      - name: Build tests
        run: cmake --build --preset tests-only --parallel

      - name: Run tests
        run: ctest --preset tests-only

      - name: Test audio category across SDL sessions
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsdl2-dev
          python3 scripts/test_sdl_audio_category.py
          c++ -std=c++17 -Iinclude $(sdl2-config --cflags) scripts/test_sdl_audio_converter.cpp $(sdl2-config --libs) -o /tmp/test-sdl-audio-converter
          /tmp/test-sdl-audio-converter
          python3 scripts/test_guest_affinity64.py
          python3 scripts/test_guest_runtime_boundaries.py
          python3 scripts/test_guest_scheduling_lifecycle.py
          python3 scripts/test_presentation_frame.py

      - name: Test DXMT ABI validator
        run: python3 -m unittest scripts/test_validate_dxmt_guest_abi.py

      - name: Execute unaligned ARM atomic regression tests
        run: |
          sudo apt-get install --yes --no-install-recommends g++-aarch64-linux-gnu qemu-user
          bash scripts/test_fex_unaligned_swap.sh
          python3 scripts/test_fex_host_abort.py
          python3 scripts/test_fex_swap_publication.py

      - name: Test patched audio resampler latency and continuity
        run: bash scripts/test-sdl-resampler-latency.sh

      - name: Test Wine64 runtime packaging contract
        run: python3 -m unittest scripts/test_wine64_runtime_packaging.py

      - name: Test raw mouse event codec
        run: python3 scripts/test_x11_raw_event.py

      - name: Test native surface resize and virtual pointer ordering
        run: python3 scripts/test_ios_surface_input.py
      - name: Verify guest signal and instance boundaries
        run: python3 scripts/test_guest_runtime_boundaries.py

      - name: Test guest file timestamp units
        run: python3 scripts/test_x64_stat_timestamp.py

      - name: Test source runtime trimming
        run: python3 scripts/test_wine_source_trim.py

      - name: Test clipped X11 pixel operations
        run: python3 scripts/test_x11_pixels.py

      - name: Test x86-64 X11 shim contract
        run: python3 -m unittest scripts/test_x64_x11_shim.py

      - name: Test DXMT guest pointer rewrite
        run: python3 -m unittest scripts/test_rewrite_dxmt_guest_pointers.py

      - name: Test x86-64 graphics probe contract
        run: python3 -m unittest scripts/test_x64_graphics_probe.py

      - name: Test Wine guest arena contract
        run: python3 -m unittest scripts/test_x64_wine_arena.py

      - name: Test Wine relay filter behavior
        run: python3 -m unittest scripts/test_x64_verbose_wine_trace.py

  fex-translator-probe:
    name: FEX translator conformance probes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out BoxedVN
        uses: actions/checkout@v6

      - name: Install translator-probe tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang cmake ninja-build nasm python3

      - name: Restore translator-probe cache
        uses: actions/cache@v5
        with:
          path: |
            third_party/fex64/fex
            build/fex-vixl-probe
          key: boxedvn-fex-vixl-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/run-fex64-vixl-probe.sh', 'scripts/fex64-patches/**', 'scripts/test-fex-exit-dispatch-contract.py', 'ios/support/include/boxedvn/fex_exit_dispatch_contract.h', 'scripts/guest-probes/fex64-loader-stall.asm', 'scripts/guest-probes/fex32-core-contract.asm', 'scripts/guest-probes/fex64-host-stubs.cpp', 'scripts/guest-probes/fex64-emitter-encoding-check.cpp', 'scripts/guest-probes/fex64-vector-store-contract.asm', 'scripts/guest-probes/fex64-negative-add-contract.asm', 'scripts/guest-probes/check-ircap-host-words.py', 'include/guest_low_alias.h', 'ios/support/include/boxedvn/launch_preflight.h', 'scripts/guest-probes/fex64-indexed-alias-contract.asm', 'scripts/guest-probes/fex64-top-alias-contract.asm', 'scripts/guest-probes/fex64-top-alias-repmov.asm', 'scripts/guest-probes/fex64-top-alias-stack.asm', 'scripts/guest-probes/fex64-dispatcher-return.asm', 'scripts/guest-probes/fex64-highstack-callret.asm', 'scripts/guest-probes/fex64-tls-selector.asm', 'include/guest_segment_table.h', 'scripts/guest-probes/fex64-kernel-probe.S', 'ios/support/include/boxedvn/exec_transition.h') }}

      - name: Fetch pinned translator source
        shell: bash
        run: bash scripts/fetch-fex64-dependencies.sh --component fex

      - name: Verify translated exit-dispatch ABI
        shell: bash
        run: >-
          python3 scripts/test-fex-exit-dispatch-contract.py
          --fex-root third_party/fex64/fex

      - name: Run x64 loader and IA-32 core fixtures through ARM64 simulator
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: bash scripts/run-fex64-vixl-probe.sh

  ipa:
    name: Unsigned IPA (${{ inputs.configuration || 'Release' }})
    needs:
      - guest-probe
      - fex-translator-probe
      - tests
      - wine64-runtime
      - x64-graphics-assets
    runs-on: macos-15
    timeout-minutes: 180
    env:
      BOXEDVN_REQUIRE_DXMT_NATIVE: 1
    steps:
      - name: Check out BoxedVN
        uses: actions/checkout@v6

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          echo "Installed Xcode applications:"
          find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort

          if [[ -n "${REQUESTED_XCODE}" ]]; then
            if [[ "${REQUESTED_XCODE}" == /* ]]; then
              xcode_app="${REQUESTED_XCODE%/Contents/Developer}"
            elif [[ "${REQUESTED_XCODE}" == Xcode*.app ]]; then
              xcode_app="/Applications/${REQUESTED_XCODE}"
            else
              xcode_app="/Applications/Xcode_${REQUESTED_XCODE}.app"
            fi

            if [[ ! -d "${xcode_app}/Contents/Developer" ]]; then
              echo "::error::Xcode '${REQUESTED_XCODE}' is not installed on this runner."
              echo "Choose one of the applications listed above, or clear the input/repository variable to use the runner default."
              exit 1
            fi

            sudo xcode-select --switch "${xcode_app}/Contents/Developer"
          fi

          echo "Selected developer directory: $(xcode-select -p)"
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

          {
            echo "## Build environment"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Configuration: \`${BUILD_CONFIGURATION}\`"
            echo "- Runner: \`${RUNNER_OS} ${RUNNER_ARCH}\`"
            echo "- Xcode: \`$(xcodebuild -version | tr '\n' ' ' | sed 's/[[:space:]]*$//')\`"
            echo "- iPhoneOS SDK: \`$(xcrun --sdk iphoneos --show-sdk-version)\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Check macOS build prerequisites
        shell: bash
        run: bash scripts/bootstrap-macos.sh

      - name: Verify session main-queue responsiveness
        shell: bash
        run: |
          mkdir -p build/run-loop-test
          xcrun clang++ -std=c++17 -fblocks -fobjc-arc -Wall -Wextra -Werror \
            -Iios/runtime/include ios/tests/test_run_loop_session.mm \
            -framework Foundation -framework CoreFoundation -o build/run-loop-test/session
          build/run-loop-test/session

      - name: Verify native FEX prediction-stack guard recovery
        shell: bash
        run: |
          mkdir -p build/callret-guard-test
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            ios/tests/test_fex_callret_guard_native.cpp -o build/callret-guard-test/test
          build/callret-guard-test/test

      - name: Verify native shared mapping aliases
        run: python3 scripts/test_native_shared_alias.py

      - name: Restore pinned third-party dependencies
        uses: actions/cache@v5
        with:
          path: third_party
          key: boxedvn-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dependencies.lock.sh', 'scripts/fetch-dependencies.sh', 'scripts/sdl-patches/**', 'scripts/test-sdl-uikit-pump.py', 'scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-fex.sh', 'scripts/fex-softfloat-namespace.py', 'scripts/fex64-patches/**', 'scripts/validate-wine64-runtime.sh', 'scripts/prepare-wine64-runtime.sh', 'scripts/build-wine64-runtime-ci.sh', 'scripts/build-boxedwine-x64-x11.sh', 'scripts/validate-x64-x11-shim.py', 'tools/x11-64/**', 'include/boxedwine_x64_x11_bridge.h', 'scripts/build-boxedwine-x64-vulkan.sh', 'scripts/validate-x64-vulkan-shim.py', 'tools/vulkan-64/**', 'include/boxedwine_x64_vulkan_bridge.h', 'scripts/prepare-dxmt-x64-dependencies.sh', 'scripts/build-dxmt-x64-pe.sh', 'scripts/dxmt-patches/**', 'scripts/d3d9-metal-patches/**', 'scripts/build-fex64-toolchains.sh', 'scripts/build-dxmt-ios-native.sh', 'scripts/rewrite-dxmt-guest-pointers.py', 'include/boxedwine_dxmt_guest_pointer.h', 'tools/dxmt/**', 'scripts/stage-x64-graphics-assets.sh', 'scripts/build-x64-graphics-probe.sh', 'scripts/guest-probes/x64-d3d11-cube.c', 'scripts/guest-probes/x64-d3d11-cube-shaders.h', 'scripts/guest-probes/x64-d3d11-cube.hlsl', 'scripts/wine64-runtime-manifest.example') }}

      - name: Fetch pinned dependencies
        shell: bash
        run: scripts/fetch-dependencies.sh --platform ios --configuration Release

      - name: Build optional FEX x86-64 translator
        shell: bash
        run: |
          bash scripts/fetch-fex64-dependencies.sh --component fex
          bash scripts/build-fex64-fex.sh --configuration Release

      - name: Verify both floating-point libraries in one native executable
        shell: bash
        run: |
          cmake -S scripts/guest-probes/softfloat-link-check -B build/softfloat-link-check -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          cmake --build build/softfloat-link-check --parallel 4
          ctest --test-dir build/softfloat-link-check --output-on-failure

      - name: Download IA-32 graphics probe
        uses: actions/download-artifact@v7
        with:
          name: guest-graphics-probe
          path: build/guest-probes

      - name: Download Wine64 runtime layers
        uses: actions/download-artifact@v7
        with:
          name: wine64-runtime
          path: build/wine64-runtime

      # Keep the legacy app resource copy in step with the WoW64 overlay.
      - name: Download rebuilt DXVK app resources
        uses: actions/download-artifact@v7
        with:
          name: dxvk-i386
          path: ios/app/Dxvk

      - name: Download x86-64 graphics resources
        uses: actions/download-artifact@v7
        with:
          name: x64-graphics-assets
          path: build/x64-graphics

      - name: Validate downloaded x86-64 runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          BOXEDVN_REQUIRE_WINE64_OSS=1 bash scripts/validate-wine64-runtime.sh \
            --input build/wine64-runtime \
            --manifest build/wine64-runtime/wine64-runtime.manifest
          python3 scripts/validate-dxmt-guest-abi.py \
            --graphics-dir build/x64-graphics

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          args=(
            scripts/build-ios.sh
            --configuration "${BUILD_CONFIGURATION}"
            --output-dir build/ci
            --skip-dependencies
            --enable-fex64
            --no-bundled-rootfs
            --wine64-runtime build/wine64-runtime
            --x64-graphics-runtime build/x64-graphics
            --dxmt-native-archive build/x64-graphics/libdxmt_combined.a
          )
          "${args[@]}"

      - name: Validate unsigned app
        shell: bash
        run: |
          set -euo pipefail
          app="build/ci/DerivedData/Build/Products/${BUILD_CONFIGURATION}-iphoneos/BoxedVN.app"

          if codesign --display "${app}" >/dev/null 2>&1; then
            echo "::error::The CI app has a code signature; refusing to label it unsigned."
            exit 1
          fi
          if [[ -e "${app}/_CodeSignature" || -e "${app}/embedded.mobileprovision" ]]; then
            echo "::error::The CI app contains signing metadata; refusing to package it as unsigned."
            exit 1
          fi
          missing=0
          for relative in \
            boxedvn-fex64-kernel-probe \
            Dxvk/d3d9.dll \
            Dxvk/d3d10core.dll \
            Dxvk/d3d11.dll \
            Dxvk/dxgi.dll \
            boxedwine64-runtime/glibc-rootfs64.zip \
            boxedwine64-runtime/wine64.zip \
            boxedwine64-runtime/wine64-runtime.manifest \
            boxedwine64-runtime/boxedvn-d3d11-cube-x64.exe \
            boxedwine64-runtime/x64-graphics.manifest \
            boxedwine64-runtime/dxmt-x64/d3d11.dll \
            boxedwine64-runtime/dxmt-x64/dxgi.dll \
            boxedwine64-runtime/dxmt-x64/d3d10core.dll \
            boxedwine64-runtime/dxmt-x64/winemetal.dll \
            boxedwine64-runtime/dxmt-x64/d3d9.dll \
            boxedwine64-runtime/dxmt-x86/d3d9.dll \
            boxedwine64-runtime/dxmt-x86/winemetal.dll; do
            if [[ ! -f "${app}/${relative}" ]]; then
              echo "::error::Missing app resource: ${relative}"
              missing=1
            fi
          done
          if [[ ${missing} -ne 0 ]]; then
            exit 1
          fi
          cmp build/guest-probes/boxedvn-fex64-kernel-probe \
              "${app}/boxedvn-fex64-kernel-probe"
          echo "Wine64 and x86-64 DXMT resources present in app bundle."

      - name: Record bundle sizes and the host symbol map
        shell: bash
        run: |
          set -euo pipefail
          app="build/ci/DerivedData/Build/Products/${BUILD_CONFIGURATION}-iphoneos/BoxedVN.app"
          mkdir -p build/artifacts
          # Device logs name busy host frames by image offset. A sorted symbol
          # map of the shipped binary resolves those offsets after the fact,
          # so a spin inside the runtime can be read without a debugger.
          nm -n -arch arm64 "${app}/BoxedVN" | gzip -9 > build/artifacts/BoxedVN.symbols.txt.gz
          # A symbol offset alone cannot distinguish a fault-report read from
          # register reconstruction. Keep just this routine's instructions.
          # Apple's objdump omits upstream's --dis-symname option. Filter its
          # ordinary Mach-O disassembly without exiting early (pipefail/SIGPIPE).
          # Symbol/string annotations can contain arbitrary bytes. Keep the
          # optional disassembly from blocking an otherwise validated IPA.
          if ! xcrun llvm-objdump --macho --disassemble "${app}/BoxedVN" \
            | LC_ALL=C awk '/^[^[:space:]]+:$/ { keep = ($0 == "_BVNFEXCPU64AdapterHandleHostFault:"); found = found || keep } keep { print } END { if (!found) exit 1 }' \
            | gzip -9 > build/artifacts/BoxedVN.fault-handler.txt.gz; then
            echo '::warning::Fault-handler disassembly unavailable; the host symbol map is still provided.'
            rm -f build/artifacts/BoxedVN.fault-handler.txt.gz
          fi
          symbol_count="$(gzip -dc build/artifacts/BoxedVN.symbols.txt.gz | grep -c ' [tT] ' || true)"
          {
            echo "## Bundle sizes"
            echo '```'
            du -sh "${app}"
            du -sh "${app}/boxedwine64-runtime"/*.zip "${app}/boxedwine64-runtime"/dxmt-x64 2>/dev/null || true
            find "${app}" -maxdepth 1 -name '*.zip' -exec du -sh {} + 2>/dev/null || true
            echo '```'
            echo "- Host text symbols in the shipped binary: ${symbol_count}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload host symbol map
        uses: actions/upload-artifact@v7
        with:
          name: host-symbols-${{ inputs.configuration || 'Release' }}
          path: |
            build/artifacts/BoxedVN.symbols.txt.gz
            build/artifacts/BoxedVN.fault-handler.txt.gz
          if-no-files-found: error
          retention-days: 14

      - name: Package increased-memory entitlement template
        shell: bash
        run: |
          set -euo pipefail
          app="build/ci/DerivedData/Build/Products/${BUILD_CONFIGURATION}-iphoneos/BoxedVN.app"
          entitled_app="build/entitled/BoxedVN.app"

          scripts/prepare-entitled-app.sh \
            --app "${app}" \
            --output "${entitled_app}"
          scripts/package-ipa.sh \
            --app "${entitled_app}" \
            --output-dir build/artifacts \
            --name BoxedVN.ipa

          ipa="build/artifacts/BoxedVN.ipa"
          checksum="$(awk '{print $1}' "${ipa}.sha256")"
          {
            echo "## Increased-memory signing template"
            echo "- File: \`BoxedVN.ipa\`"
            echo "- SHA-256: \`${checksum}\`"
            echo "- Embedded request: \`com.apple.developer.kernel.increased-memory-limit = true\`"
            echo "- Signing: ad hoc only; your sideloader must replace it after GetMoreRAM enables the same App ID"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish directly downloadable IPA
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="ios-latest"
          notes_file="${RUNNER_TEMP}/boxedvn-ios-release.md"
          printf '%s\n' \
            'Rolling iOS build from GitHub Actions.' \
            '' \
            "Commit: ${GITHUB_SHA}" \
            "Configuration: ${BUILD_CONFIGURATION}" \
            'BoxedVN.ipa is the increased-memory entitlement template and requires signing by your sideloader.' \
            > "${notes_file}"

          if ! gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release create "${release_tag}" \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "Latest BoxedVN iOS build" \
              --notes-file "${notes_file}"
          else
            gh release edit "${release_tag}" \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "Latest BoxedVN iOS build" \
              --notes-file "${notes_file}"
          fi

          gh release upload "${release_tag}" \
            build/artifacts/BoxedVN.ipa \
            build/artifacts/BoxedVN.ipa.sha256 \
            build/wine64-runtime/wine64-pe32.zip \
            --clobber
          echo "- 32-bit PE layer (optional, place in the container folder): https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/wine64-pe32.zip" \
            >> "${GITHUB_STEP_SUMMARY}"

          echo "- Direct IPA: https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/BoxedVN.ipa" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ inputs.configuration || 'Release' }}
          path: |
            build/ci/xcodebuild.log
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
            third_party/build/**/*.log
          if-no-files-found: ignore
          retention-days: 14
