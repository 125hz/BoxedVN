name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
      xcode_version:
        description: Xcode version installed on macos-15 (blank uses the runner default or BOXEDVN_XCODE_VERSION)
        required: false
        default: ""
        type: string
  push:
    branches:
      - ios
      - main
      - master
    paths: &ios_build_paths
      - .github/workflows/build-ios.yml
      - CMakeLists.txt
      - CMakePresets.json
      - buildFlags.txt
      - cmake/**
      - include/**
      - ios/**
      - lib/**
      - platform/**
      - scripts/**
      - source/**
      - THIRD_PARTY_NOTICES.md
  pull_request:
    branches:
      - ios
      - main
      - master
    paths: *ios_build_paths

permissions:
  contents: write

concurrency:
  group: build-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
  REQUESTED_XCODE: ${{ inputs.xcode_version || vars.BOXEDVN_XCODE_VERSION || '' }}

jobs:
  guest-probe:
    name: Build IA-32 graphics probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out BoxedVN
        uses: actions/checkout@v6

      - name: Install IA-32 PE compiler
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends g++-mingw-w64-i686

      - name: Build and validate graphics probe
        shell: bash
        run: |
          bash scripts/build-guest-graphics-probe.sh
          bash scripts/build-guest-fex64-probe.sh

      - name: Upload graphics probe
        uses: actions/upload-artifact@v7
        with:
          name: guest-graphics-probe
          path: |
            build/guest-probes/boxedvn-d3d9-cube.exe
            build/guest-probes/boxedvn-d3d9-cube.exe.sha256
            build/guest-probes/boxedvn-fex64-kernel-probe
            build/guest-probes/boxedvn-fex64-kernel-probe.sha256
          if-no-files-found: error
          retention-days: 14

  wine64-runtime:
    name: Build x86-64 Wine runtime layers
    runs-on: ubuntu-24.04
    # The i386 Wine package is 100 MB from the runner's Ubuntu mirror, which
    # served it at 110 kB/s on one run (15 minutes); the package is cached
    # below, but an uncached run still has to fit. The OSS driver step builds
    # Wine's own configure and one dll from source and is bounded at 25
    # minutes of that, so the job needs room for both worst cases at once.
    timeout-minutes: 70
    steps:
      - name: Check out BoxedVN
        uses: actions/checkout@v6

      - name: Install Wine64 and X11 runtime packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            wine64 wine64-tools zip unzip gcc \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libx11-6 libxext6 libxrender1 libxfixes3 libxcursor1 \
            libxcomposite1 libxi6 libxinerama1 libxxf86vm1 libxrandr2 \
            libx11-data \
            libfreetype6 libfontconfig1 libharfbuzz0b \
            libpng16-16t64 libbrotli1 libbz2-1.0 zlib1g \
            fontconfig fontconfig-config fonts-liberation \
            fonts-wine libxext6

      - name: Record the installed Wine version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/wine-i386
          dpkg-query -W -f='${Version}' libwine > build/wine-i386/version.txt
          cat build/wine-i386/version.txt

      # Keyed on the exact amd64 libwine version so a mismatched pair can
      # never be restored: a new Wine version misses the cache and fetches.
      - name: Restore the cached 32-bit Wine package
        uses: actions/cache@v4
        with:
          path: build/wine-i386/deb
          key: libwine-i386-${{ runner.os }}-${{ hashFiles('build/wine-i386/version.txt') }}

      - name: Fetch the matching 32-bit Wine PE builtins
        shell: bash
        run: |
          set -euo pipefail
          # New WoW64 runs 32-bit PE code inside the 64-bit Unix process, so
          # the runtime needs the i386-windows PE tree that Ubuntu's wine64
          # package does not ship. It lives in libwine:i386, at the same
          # version as the amd64 libwine already installed -- a mismatched pair
          # would have the 32-bit builtins calling into a 64-bit ntdll they
          # were not built against.
          #
          # The package is UNPACKED, never installed: apt-get install would
          # pull in a whole i386 library chain, and the i386-unix tree inside
          # the package is the OLD WoW64, which is what needs those libraries.
          # Only the PE tree is handed to the packaging script.
          libwine_version="$(cat build/wine-i386/version.txt)"
          echo "installed amd64 libwine: ${libwine_version}"
          mkdir -p build/wine-i386/deb
          i386_deb="$(find build/wine-i386/deb -maxdepth 1 -name "libwine_${libwine_version//:/%3a}_i386.deb" -print -quit)"
          if [[ -z "${i386_deb}" ]]; then
            # Not cached for this version: fetch it. The mirror served this
            # 100 MB package at 110 kB/s on one run, so the cache above is
            # what keeps the job inside its time limit on later runs.
            sudo dpkg --add-architecture i386
            sudo apt-get update
            (cd build/wine-i386/deb && apt-get download "libwine:i386=${libwine_version}")
            i386_deb="$(find build/wine-i386/deb -maxdepth 1 -name '*_i386.deb' -print -quit)"
          else
            echo "libwine:i386 ${libwine_version} restored from the cache"
          fi
          test -n "${i386_deb}"
          dpkg-deb -x "${i386_deb}" build/wine-i386/root
          pe32_dir=build/wine-i386/root/usr/lib/i386-linux-gnu/wine/i386-windows
          for required in ntdll.dll kernel32.dll; do
            test -s "${pe32_dir}/${required}" || {
              echo "libwine:i386 ${libwine_version} has no ${required} under ${pe32_dir}" >&2
              exit 1
            }
          done
          # 32-bit wined3d imports zlib1.dll. The amd64 package carries it in
          # its PE tree; the i386 package did not on the device (the 32-bit
          # probe died with STATUS_DLL_NOT_FOUND on it), so it is taken from
          # the i686 mingw zlib package when the tree lacks it.
          if [[ ! -s "${pe32_dir}/zlib1.dll" ]]; then
            sudo apt-get install -y libz-mingw-w64
            mingw_zlib="$(find /usr/i686-w64-mingw32 -name zlib1.dll -print -quit)"
            test -s "${mingw_zlib}" || {
              echo "i386-windows has no zlib1.dll and libz-mingw-w64 provides no i686 zlib1.dll" >&2
              exit 1
            }
            cp "${mingw_zlib}" "${pe32_dir}/zlib1.dll"
            echo "i386-windows/zlib1.dll supplied from ${mingw_zlib}"
          fi
          # The same gap, one module further along. Ubuntu builds Wine's i386
          # PE modules with mingw-w64 and some of them import the shared i686
          # libgcc; a device run resolved the whole 32-bit chain and then
          # missed libgcc_s_dw2-1.dll in all four search directories, right
          # after mapping opengl32.dll and again after uxtheme.dll. Neither
          # Wine tree builds it, so it comes from the i686 mingw gcc runtime.
          # The win32 and posix thread flavours ship the same unwinder DLL and
          # either is fine here: nothing in the tree links libwinpthread.
          if [[ ! -s "${pe32_dir}/libgcc_s_dw2-1.dll" ]]; then
            mingw_libgcc="$(find /usr/lib/gcc/i686-w64-mingw32 -name libgcc_s_dw2-1.dll -print -quit 2>/dev/null || true)"
            if [[ -z "${mingw_libgcc}" ]]; then
              sudo apt-get install -y gcc-mingw-w64-i686
              mingw_libgcc="$(find /usr/lib/gcc/i686-w64-mingw32 -name libgcc_s_dw2-1.dll -print -quit)"
            fi
            test -s "${mingw_libgcc}" || {
              echo "i386-windows has no libgcc_s_dw2-1.dll and gcc-mingw-w64-i686 provides no i686 libgcc_s_dw2-1.dll" >&2
              exit 1
            }
            cp "${mingw_libgcc}" "${pe32_dir}/libgcc_s_dw2-1.dll"
            echo "i386-windows/libgcc_s_dw2-1.dll supplied from ${mingw_libgcc}"
          fi
          echo "32-bit PE builtins: $(find "${pe32_dir}" -type f | wc -l)"

      # Wine's OSS audio driver, which Ubuntu does not build: its configure
      # gates dlls/wineoss.drv on an OSSv4 <sys/soundcard.h>, so the package
      # carries winealsa and winepulse instead -- and neither can work in
      # BoxedWine, which emulates /dev/dsp and /dev/mixer but no PulseAudio
      # socket and no /dev/snd. See docs/PLAN_X64_AUDIO.md.
      #
      # Non-fatal on purpose. This builds Wine from source against the same
      # upstream version as the installed amd64 package, and that build has
      # never run in this workflow before: a failure here must report itself
      # and leave every other lane shippable, not stop the pipeline. The
      # runtime builder is told about the driver only when both halves exist,
      # and scripts/validate-wine64-runtime.sh names the absence either way.
      # Arm the hard gate (BOXEDVN_REQUIRE_WINE64_OSS=1 on the validate step)
      # once a run here has been seen to succeed. It is still DISARMED: the
      # two reasons the step could never have succeeded are fixed (the OSSv4
      # header is now installed, and the post-configure check no longer greps
      # for a HAVE_SYS_SOUNDCARD_H that Wine 9.0 never defines), but a Wine
      # build from source has still never completed in this workflow, so the
      # gate stays off until one has.
      - name: Build Wine's OSS audio driver
        id: wineoss
        continue-on-error: true
        # Bounded so a Wine build that goes wrong cannot eat the job's budget
        # and take the runtime layers down with it. A step timeout counts as a
        # step failure, which continue-on-error absorbs; a job timeout would
        # not be absorbed by anything.
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          # oss4-dev is the OSSv4 header, and it is the whole reason this step
          # used to fail on its first check. linux-libc-dev's
          # <linux/soundcard.h> is OSSv3: it has the SNDCTL_DSP_* ioctls and
          # none of oss_sysinfo, oss_audioinfo, SNDCTL_SYSINFO,
          # SNDCTL_AUDIOINFO or SNDCTL_ENGINEINFO, which are exactly what
          # dlls/wineoss.drv enumerates devices with. oss4-dev (universe)
          # installs the real OSSv4 header AS /usr/include/linux/soundcard.h
          # and dpkg-diverts the kernel's copy to soundcard.h.oss3 in its
          # preinst, so the two packages coexist and no other build on this
          # runner loses a header it was using.
          sudo apt-get install --yes --no-install-recommends \
            gcc-mingw-w64-x86-64 flex bison linux-libc-dev oss4-dev
          # Ubuntu's package version carries an epoch and a packaging suffix;
          # Wine's own release tarball is named for the upstream version
          # alone. "1:9.0~repack-4build3" is upstream "9.0".
          upstream="$(sed -E 's/^[0-9]+://; s/[~-].*$//' build/wine-i386/version.txt)"
          echo "installed libwine upstream version: ${upstream}"
          bash scripts/build-wine64-oss-driver.sh \
            --output-dir build/wine64-oss \
            --wine-version "${upstream}"

      - name: Build and validate Wine64 layers
        shell: bash
        env:
          CI: true
        run: |
          set -euo pipefail
          bash scripts/build-boxedwine-dxmt-unixlib.sh build/winemetal.so
          # The guest X11 client libraries are validated against the very
          # winex11.so that gets packaged, so a Wine update that imports a
          # new Xlib symbol fails here rather than at the guest's dlopen.
          winex11="$(find /usr/lib -path '*/x86_64-unix/winex11.so' -print -quit)"
          test -n "${winex11}"
          bash scripts/build-boxedwine-x64-x11.sh \
            --output-dir build/x64-x11 \
            --winex11 "${winex11}"
          # The guest Vulkan ICD, validated against the same winex11.so: that
          # driver is what dlopens libvulkan.so.1 and binds sixteen symbols out
          # of it by name, so a Wine update that adds a seventeenth fails here
          # rather than as a silent "no Vulkan adapter" on a device.
          bash scripts/build-boxedwine-x64-vulkan.sh \
            --output-dir build/x64-vulkan \
            --winex11 "${winex11}"
          # The OSS driver is passed only when both halves are there. Half a
          # pair is a build failure in the runtime builder, by design: the PE
          # half reaches the unix half through Wine's private
          # __wine_unix_call boundary and cannot load without it.
          oss_args=()
          if [[ -s build/wine64-oss/wineoss.so && -s build/wine64-oss/wineoss.drv ]]; then
            oss_args=(--oss-driver-dir build/wine64-oss)
            echo "packaging Wine's OSS audio driver"
          else
            echo "no OSS audio driver was built; the runtime will carry no audio backend" >&2
          fi
          bash scripts/build-wine64-runtime-ci.sh \
            --output-dir build/wine64-runtime \
            --dxmt-unixlib build/winemetal.so \
            --x11-shim-dir build/x64-x11 \
            --vulkan-shim build/x64-vulkan/libvulkan.so.1 \
            --dxvk-i386-dir ios/app/Dxvk \
            --i386-pe-dir build/wine-i386/root/usr/lib/i386-linux-gnu/wine/i386-windows \
            "${oss_args[@]+"${oss_args[@]}"}"
          bash scripts/validate-wine64-runtime.sh \
            --input build/wine64-runtime \
            --manifest build/wine64-runtime/wine64-runtime.manifest

      - name: Upload Wine64 runtime layers
        uses: actions/upload-artifact@v7
        with:
          name: wine64-runtime
          path: build/wine64-runtime
          if-no-files-found: error
          retention-days: 14

  x64-graphics-assets:
    name: Build x86-64 DXMT graphics resources
    runs-on: macos-15
    # The first uncached run builds Windows and iPhoneOS LLVM libraries.
    # Subsequent runs restore them from the pinned cache, but the initial build
    # needs enough room to finish instead of producing a misleading timeout.
    timeout-minutes: 300
    steps:
      - name: Check out BoxedVN
        uses: actions/checkout@v6

      - name: Install DXMT build tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user meson==1.10.0 --break-system-packages
          echo "$(python3 -m site --user-base)/bin" >> "${GITHUB_PATH}"

      - name: Restore DXMT cross-toolchain cache
        id: dxmt-toolchains-cache
        uses: actions/cache/restore@v5
        with:
          path: third_party/fex64/toolchains
          key: boxedvn-dxmt-toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-toolchains.sh') }}-${{ github.run_id }}
          restore-keys: |
            boxedvn-dxmt-toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-toolchains.sh') }}-
            fex64-toolchains-${{ runner.os }}-

      - name: Restore pinned LLVM source cache
        id: dxmt-llvm-source-cache
        uses: actions/cache/restore@v5
        with:
          path: third_party/fex64/llvm-project
          key: boxedvn-dxmt-llvm-source-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh') }}
          restore-keys: |
            boxedvn-dxmt-llvm-source-${{ runner.os }}-
            fex64-llvm-src-${{ runner.os }}-

      - name: Fetch and verify DXMT build inputs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-fex64-dependencies.sh --component mythic
          bash scripts/prepare-dxmt-x64-dependencies.sh

      - name: Build and stage x86-64 DXMT resources
        shell: bash
        run: |
          set -euo pipefail
          source scripts/dependencies.fex64.lock.sh
          mingw="third_party/fex64/toolchains/llvm-mingw-${BOXEDVN_LLVM_MINGW_VERSION}-ucrt-macos-universal"
          wine_sdk="third_party/fex64/toolchains/wine-sdk"
          llvm="third_party/fex64/llvm-project"
          bash scripts/validate-boxedwine-dxmt-unixlib.sh
          bash scripts/build-dxmt-x64-pe.sh \
            --source third_party/fex64/dxmt \
            --toolchain "${mingw}" \
            --wine-install "${wine_sdk}" \
            --llvm-source "${llvm}" \
            --output-dir build/dxmt-pe
          bash scripts/build-fex64-toolchains.sh --stage llvm-ios
          bash scripts/build-dxmt-ios-native.sh
          bash scripts/build-x64-graphics-probe.sh \
            --toolchain "${mingw}" \
            --output build/guest-probes/boxedvn-d3d11-cube-x64.exe
          bash scripts/stage-x64-graphics-assets.sh \
            --probe build/guest-probes/boxedvn-d3d11-cube-x64.exe \
            --dxmt build/dxmt-pe \
            --native-archive third_party/fex64/dxmt-ios/libdxmt_combined.a \
            --output-dir build/x64-graphics

      - name: Upload x86-64 graphics resources
        uses: actions/upload-artifact@v7
        with:
          name: x64-graphics-assets
          path: build/x64-graphics
          if-no-files-found: error
          retention-days: 14

      # LLVM is the long pole in the first DXMT build. Save its partial Ninja
      # tree even when a later compiler or staging step fails so the next
      # manually dispatched run resumes instead of discarding completed work.
      - name: Save DXMT cross-toolchain cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: third_party/fex64/toolchains
          key: boxedvn-dxmt-toolchains-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-toolchains.sh') }}-${{ github.run_id }}

      - name: Save pinned LLVM source cache
        if: always() && steps.dxmt-llvm-source-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: third_party/fex64/llvm-project
          key: boxedvn-dxmt-llvm-source-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh') }}

  tests:
    name: Host-independent tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out BoxedVN
        uses: actions/checkout@v6

      - name: Report tool versions
        shell: bash
        run: |
          cmake --version
          ninja --version
          c++ --version

      - name: Configure tests
        run: cmake --preset tests-only

      - name: Build tests
        run: cmake --build --preset tests-only --parallel

      - name: Run tests
        run: ctest --preset tests-only

      - name: Test DXMT ABI validator
        run: python3 -m unittest scripts/test_validate_dxmt_guest_abi.py

      - name: Test Wine64 runtime packaging contract
        run: python3 -m unittest scripts/test_wine64_runtime_packaging.py

      - name: Test x86-64 X11 shim contract
        run: python3 -m unittest scripts/test_x64_x11_shim.py

      - name: Test DXMT guest pointer rewrite
        run: python3 -m unittest scripts/test_rewrite_dxmt_guest_pointers.py

      - name: Test x86-64 graphics probe contract
        run: python3 -m unittest scripts/test_x64_graphics_probe.py

      - name: Test Wine guest arena contract
        run: python3 -m unittest scripts/test_x64_wine_arena.py

  fex-translator-probe:
    name: FEX translator conformance probes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out BoxedVN
        uses: actions/checkout@v6

      - name: Install translator-probe tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang cmake ninja-build nasm python3

      - name: Restore translator-probe cache
        uses: actions/cache@v5
        with:
          path: |
            third_party/fex64/fex
            build/fex-vixl-probe
          key: boxedvn-fex-vixl-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/run-fex64-vixl-probe.sh', 'scripts/fex64-patches/**', 'scripts/test-fex-exit-dispatch-contract.py', 'ios/support/include/boxedvn/fex_exit_dispatch_contract.h', 'scripts/guest-probes/fex64-loader-stall.asm', 'scripts/guest-probes/fex32-core-contract.asm', 'scripts/guest-probes/fex64-host-stubs.cpp', 'scripts/guest-probes/fex64-emitter-encoding-check.cpp', 'scripts/guest-probes/fex64-vector-store-contract.asm', 'scripts/guest-probes/fex64-negative-add-contract.asm', 'scripts/guest-probes/check-ircap-host-words.py', 'include/guest_low_alias.h', 'ios/support/include/boxedvn/launch_preflight.h', 'scripts/guest-probes/fex64-indexed-alias-contract.asm', 'scripts/guest-probes/fex64-top-alias-contract.asm', 'scripts/guest-probes/fex64-top-alias-repmov.asm', 'scripts/guest-probes/fex64-top-alias-stack.asm', 'scripts/guest-probes/fex64-dispatcher-return.asm', 'scripts/guest-probes/fex64-highstack-callret.asm', 'include/guest_segment_table.h', 'scripts/guest-probes/fex64-kernel-probe.S', 'ios/support/include/boxedvn/exec_transition.h') }}

      - name: Fetch pinned translator source
        shell: bash
        run: bash scripts/fetch-fex64-dependencies.sh --component fex

      - name: Verify translated exit-dispatch ABI
        shell: bash
        run: >-
          python3 scripts/test-fex-exit-dispatch-contract.py
          --fex-root third_party/fex64/fex

      - name: Run x64 loader and IA-32 core fixtures through ARM64 simulator
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: bash scripts/run-fex64-vixl-probe.sh

  ipa:
    name: Unsigned IPA (${{ inputs.configuration || 'Release' }})
    needs:
      - guest-probe
      - fex-translator-probe
      - tests
      - wine64-runtime
      - x64-graphics-assets
    runs-on: macos-15
    timeout-minutes: 180
    env:
      BOXEDVN_REQUIRE_DXMT_NATIVE: 1
    steps:
      - name: Check out BoxedVN
        uses: actions/checkout@v6

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          echo "Installed Xcode applications:"
          find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort

          if [[ -n "${REQUESTED_XCODE}" ]]; then
            if [[ "${REQUESTED_XCODE}" == /* ]]; then
              xcode_app="${REQUESTED_XCODE%/Contents/Developer}"
            elif [[ "${REQUESTED_XCODE}" == Xcode*.app ]]; then
              xcode_app="/Applications/${REQUESTED_XCODE}"
            else
              xcode_app="/Applications/Xcode_${REQUESTED_XCODE}.app"
            fi

            if [[ ! -d "${xcode_app}/Contents/Developer" ]]; then
              echo "::error::Xcode '${REQUESTED_XCODE}' is not installed on this runner."
              echo "Choose one of the applications listed above, or clear the input/repository variable to use the runner default."
              exit 1
            fi

            sudo xcode-select --switch "${xcode_app}/Contents/Developer"
          fi

          echo "Selected developer directory: $(xcode-select -p)"
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

          {
            echo "## Build environment"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Configuration: \`${BUILD_CONFIGURATION}\`"
            echo "- Runner: \`${RUNNER_OS} ${RUNNER_ARCH}\`"
            echo "- Xcode: \`$(xcodebuild -version | tr '\n' ' ' | sed 's/[[:space:]]*$//')\`"
            echo "- iPhoneOS SDK: \`$(xcrun --sdk iphoneos --show-sdk-version)\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Check macOS build prerequisites
        shell: bash
        run: bash scripts/bootstrap-macos.sh

      - name: Restore pinned third-party dependencies
        uses: actions/cache@v5
        with:
          path: third_party
          key: boxedvn-third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/dependencies.lock.sh', 'scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-fex.sh', 'scripts/fex64-patches/**', 'scripts/validate-wine64-runtime.sh', 'scripts/prepare-wine64-runtime.sh', 'scripts/build-wine64-runtime-ci.sh', 'scripts/build-boxedwine-x64-x11.sh', 'scripts/validate-x64-x11-shim.py', 'tools/x11-64/**', 'include/boxedwine_x64_x11_bridge.h', 'scripts/build-boxedwine-x64-vulkan.sh', 'scripts/validate-x64-vulkan-shim.py', 'tools/vulkan-64/**', 'include/boxedwine_x64_vulkan_bridge.h', 'scripts/prepare-dxmt-x64-dependencies.sh', 'scripts/build-dxmt-x64-pe.sh', 'scripts/build-fex64-toolchains.sh', 'scripts/build-dxmt-ios-native.sh', 'scripts/rewrite-dxmt-guest-pointers.py', 'include/boxedwine_dxmt_guest_pointer.h', 'tools/dxmt/**', 'scripts/stage-x64-graphics-assets.sh', 'scripts/build-x64-graphics-probe.sh', 'scripts/guest-probes/x64-d3d11-cube.c', 'scripts/guest-probes/x64-d3d11-cube-shaders.h', 'scripts/guest-probes/x64-d3d11-cube.hlsl', 'scripts/wine64-runtime-manifest.example') }}

      - name: Fetch pinned dependencies
        shell: bash
        run: scripts/fetch-dependencies.sh --platform ios --configuration Release

      - name: Build optional FEX x86-64 translator
        shell: bash
        run: |
          bash scripts/fetch-fex64-dependencies.sh --component fex
          bash scripts/build-fex64-fex.sh --configuration Release

      - name: Download IA-32 graphics probe
        uses: actions/download-artifact@v7
        with:
          name: guest-graphics-probe
          path: build/guest-probes

      - name: Download Wine64 runtime layers
        uses: actions/download-artifact@v7
        with:
          name: wine64-runtime
          path: build/wine64-runtime

      - name: Download x86-64 graphics resources
        uses: actions/download-artifact@v7
        with:
          name: x64-graphics-assets
          path: build/x64-graphics

      - name: Validate downloaded x86-64 runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/validate-wine64-runtime.sh \
            --input build/wine64-runtime \
            --manifest build/wine64-runtime/wine64-runtime.manifest
          python3 scripts/validate-dxmt-guest-abi.py \
            --graphics-dir build/x64-graphics

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          args=(
            scripts/build-ios.sh
            --configuration "${BUILD_CONFIGURATION}"
            --output-dir build/ci
            --skip-dependencies
            --enable-fex64
            --no-bundled-rootfs
            --wine64-runtime build/wine64-runtime
            --x64-graphics-runtime build/x64-graphics
            --dxmt-native-archive build/x64-graphics/libdxmt_combined.a
          )
          "${args[@]}"

      - name: Validate unsigned app
        shell: bash
        run: |
          set -euo pipefail
          app="build/ci/DerivedData/Build/Products/${BUILD_CONFIGURATION}-iphoneos/BoxedVN.app"

          if codesign --display "${app}" >/dev/null 2>&1; then
            echo "::error::The CI app has a code signature; refusing to label it unsigned."
            exit 1
          fi
          if [[ -e "${app}/_CodeSignature" || -e "${app}/embedded.mobileprovision" ]]; then
            echo "::error::The CI app contains signing metadata; refusing to package it as unsigned."
            exit 1
          fi
          missing=0
          for relative in \
            boxedvn-fex64-kernel-probe \
            Dxvk/d3d9.dll \
            Dxvk/d3d10core.dll \
            Dxvk/d3d11.dll \
            Dxvk/dxgi.dll \
            boxedwine64-runtime/glibc-rootfs64.zip \
            boxedwine64-runtime/wine64.zip \
            boxedwine64-runtime/wine64-runtime.manifest \
            boxedwine64-runtime/boxedvn-d3d11-cube-x64.exe \
            boxedwine64-runtime/x64-graphics.manifest \
            boxedwine64-runtime/dxmt-x64/d3d11.dll \
            boxedwine64-runtime/dxmt-x64/dxgi.dll \
            boxedwine64-runtime/dxmt-x64/d3d10core.dll \
            boxedwine64-runtime/dxmt-x64/winemetal.dll; do
            if [[ ! -f "${app}/${relative}" ]]; then
              echo "::error::Missing app resource: ${relative}"
              missing=1
            fi
          done
          if [[ ${missing} -ne 0 ]]; then
            exit 1
          fi
          cmp build/guest-probes/boxedvn-fex64-kernel-probe \
              "${app}/boxedvn-fex64-kernel-probe"
          echo "Wine64 and x86-64 DXMT resources present in app bundle."

      - name: Record bundle sizes and the host symbol map
        shell: bash
        run: |
          set -euo pipefail
          app="build/ci/DerivedData/Build/Products/${BUILD_CONFIGURATION}-iphoneos/BoxedVN.app"
          mkdir -p build/artifacts
          # Device logs name busy host frames by image offset. A sorted symbol
          # map of the shipped binary resolves those offsets after the fact,
          # so a spin inside the runtime can be read without a debugger.
          nm -n -arch arm64 "${app}/BoxedVN" | gzip -9 > build/artifacts/BoxedVN.symbols.txt.gz
          symbol_count="$(gzip -dc build/artifacts/BoxedVN.symbols.txt.gz | grep -c ' [tT] ' || true)"
          {
            echo "## Bundle sizes"
            echo '```'
            du -sh "${app}"
            du -sh "${app}/boxedwine64-runtime"/*.zip "${app}/boxedwine64-runtime"/dxmt-x64 2>/dev/null || true
            find "${app}" -maxdepth 1 -name '*.zip' -exec du -sh {} + 2>/dev/null || true
            echo '```'
            echo "- Host text symbols in the shipped binary: ${symbol_count}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload host symbol map
        uses: actions/upload-artifact@v7
        with:
          name: host-symbols-${{ inputs.configuration || 'Release' }}
          path: build/artifacts/BoxedVN.symbols.txt.gz
          if-no-files-found: error
          retention-days: 14

      - name: Package increased-memory entitlement template
        shell: bash
        run: |
          set -euo pipefail
          app="build/ci/DerivedData/Build/Products/${BUILD_CONFIGURATION}-iphoneos/BoxedVN.app"
          entitled_app="build/entitled/BoxedVN.app"

          scripts/prepare-entitled-app.sh \
            --app "${app}" \
            --output "${entitled_app}"
          scripts/package-ipa.sh \
            --app "${entitled_app}" \
            --output-dir build/artifacts \
            --name BoxedVN.ipa

          ipa="build/artifacts/BoxedVN.ipa"
          checksum="$(awk '{print $1}' "${ipa}.sha256")"
          {
            echo "## Increased-memory signing template"
            echo "- File: \`BoxedVN.ipa\`"
            echo "- SHA-256: \`${checksum}\`"
            echo "- Embedded request: \`com.apple.developer.kernel.increased-memory-limit = true\`"
            echo "- Signing: ad hoc only; your sideloader must replace it after GetMoreRAM enables the same App ID"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish directly downloadable IPA
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="ios-latest"
          notes_file="${RUNNER_TEMP}/boxedvn-ios-release.md"
          printf '%s\n' \
            'Rolling iOS build from GitHub Actions.' \
            '' \
            "Commit: ${GITHUB_SHA}" \
            "Configuration: ${BUILD_CONFIGURATION}" \
            'BoxedVN.ipa is the increased-memory entitlement template and requires signing by your sideloader.' \
            > "${notes_file}"

          if ! gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release create "${release_tag}" \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "Latest BoxedVN iOS build" \
              --notes-file "${notes_file}"
          else
            gh release edit "${release_tag}" \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "Latest BoxedVN iOS build" \
              --notes-file "${notes_file}"
          fi

          gh release upload "${release_tag}" \
            build/artifacts/BoxedVN.ipa \
            build/artifacts/BoxedVN.ipa.sha256 \
            build/wine64-runtime/wine64-pe32.zip \
            --clobber
          echo "- 32-bit PE layer (optional, place in the container folder): https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/wine64-pe32.zip" \
            >> "${GITHUB_STEP_SUMMARY}"

          echo "- Direct IPA: https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/BoxedVN.ipa" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ inputs.configuration || 'Release' }}
          path: |
            build/ci/xcodebuild.log
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
            third_party/build/**/*.log
          if-no-files-found: ignore
          retention-days: 14
