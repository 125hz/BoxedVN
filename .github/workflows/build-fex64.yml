name: Build fex64 toolchains

# The fex64 stack cannot be built on a PC, so CI is the only feedback loop
# this branch has. It is deliberately split by cost:
#
#   pins        seconds   - do the pinned commits still exist and check out?
#   toolchains  hours     - llvm-mingw, FreeType and LLVM cross-built for
#                           iphoneos; changes only when the lock file changes,
#                           so it is cached on that file's hash.
#
# Later stages - Wine's macOS and ARM64EC builds, its iphoneos unix side, DXMT,
# FEX, and the unsigned IPA - land here as separate jobs as each recipe is
# established. See docs/ARCHITECTURE_FEX64.md for the order and why.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: How far to go
        required: true
        default: pins
        type: choice
        options:
          - pins
          - fex
          - app
          - wine
          - toolchains
      force_rebuild:
        description: Ignore the toolchain cache and rebuild from scratch
        required: false
        default: false
        type: boolean
  push:
    branches:
      - fex64
    paths: &fex64_paths
      - .github/workflows/build-fex64.yml
      - .github/fex64-fetch.sh
      - scripts/common.sh
      - scripts/dependencies.fex64.lock.sh
      - scripts/fetch-fex64-dependencies.sh
      - scripts/build-fex64-toolchains.sh
      - scripts/build-fex64-fex.sh
      - scripts/build-fex64-app.sh
      - scripts/build-fex64-wine.sh
      - scripts/package-ipa.sh
      - scripts/validate-app.sh
      - ios/fex/**
      - ios/project.yml
      - patches/**
  pull_request:
    branches:
      - fex64
    paths: *fex64_paths

permissions:
  contents: read

concurrency:
  group: build-fex64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: Pinned sources resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/fetch-fex64-dependencies.sh .github/fex64-fetch.sh

      # Fetching by commit is the whole point of the pin, and it is also the
      # thing that breaks silently when a fork force-pushes. Checking it costs
      # a minute and saves a multi-hour job that would have failed at the end.
      #
      # One step per component, and each one republishes its own failure as an
      # ::error:: annotation. Actions logs need a token to read; annotations do
      # not, so this is what makes a red run diagnosable by anyone looking at
      # the repository rather than only by whoever is signed in.
      - name: Fetch FEX
        if: always()
        run: .github/fex64-fetch.sh fex

      - name: Fetch Wine
        if: always()
        run: .github/fex64-fetch.sh wine

      - name: Fetch DXMT
        if: always()
        run: .github/fex64-fetch.sh dxmt

      - name: Report what resolved
        run: |
          for component in fex wine dxmt; do
            directory="third_party/fex64/${component}"
            printf '%-6s %s\n' "${component}" \
              "$(git -C "${directory}" rev-parse HEAD)"
          done

  fex:
    name: FEX for iphoneos
    needs: pins
    # Ladder A. Minutes, not hours, and it needs none of the toolchain work -
    # so it runs on every push here, unlike the toolchains job.
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.stage == 'fex'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show the build machine
        run: |
          sw_vers
          uname -m
          sysctl -n hw.ncpu
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: brew install ninja

      - name: Make scripts executable
        run: chmod +x scripts/*.sh .github/*.sh

      - name: Fetch FEX
        run: scripts/fetch-fex64-dependencies.sh --component fex

      - name: Cache the FEX build directory
        uses: actions/cache@v4
        with:
          path: third_party/fex64/fex-build-ios
          key: fex64-fex-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-fex.sh') }}
          restore-keys: fex64-fex-${{ runner.os }}-

      - name: Build FEX
        run: scripts/build-fex64-fex.sh

      - uses: actions/upload-artifact@v4
        with:
          name: fex64-fex-iphoneos
          path: third_party/fex64/fex-ios
          retention-days: 14
          if-no-files-found: error

  app:
    name: fex64 app and unsigned IPA
    needs: fex
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.stage == 'app'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ninja

      - name: Make scripts executable
        run: chmod +x scripts/*.sh .github/*.sh

      - name: Fetch FEX
        run: scripts/fetch-fex64-dependencies.sh --component fex

      # XcodeGen only; the emulator's dependencies are not needed to build this
      # target, and fetching them would add MoltenVK and SDL to a job that
      # links neither.
      - name: Restore third-party cache
        uses: actions/cache@v4
        with:
          path: third_party
          key: fex64-app-${{ runner.os }}-${{ hashFiles('scripts/dependencies.lock.sh', 'scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-fex.sh') }}
          restore-keys: fex64-app-${{ runner.os }}-

      - name: Fetch XcodeGen
        run: scripts/fetch-dependencies.sh --platform ios --configuration Release || true

      - name: Build the app and package the IPA
        run: scripts/build-fex64-app.sh --configuration Release

      - uses: actions/upload-artifact@v4
        with:
          name: fex64-unsigned-ipa
          path: build/fex64-Release/artifacts
          retention-days: 14
          if-no-files-found: error

      - name: Publish the build log when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fex64-app-xcodebuild-log
          path: build/fex64-Release/xcodebuild.log
          if-no-files-found: ignore

  wine:
    name: Wine trees for the fex64 stack
    needs: pins
    # Manual: this is an unestablished recipe and a long build, so it should
    # not run on every push while it is being worked out.
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'wine'
    runs-on: macos-15
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install bison flex mingw-w64 || true
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh .github/*.sh

      - name: Fetch Wine
        run: scripts/fetch-fex64-dependencies.sh --component wine

      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/fex64/toolchains
          key: fex64-toolchains-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-toolchains.sh') }}
          restore-keys: fex64-toolchains-${{ runner.os }}-

      - name: Make sure llvm-mingw is present
        run: scripts/build-fex64-toolchains.sh --stage llvm-mingw

      - name: Build the Wine trees
        run: scripts/build-fex64-wine.sh --tree all

      - name: Publish the generated headers
        run: |
          set -eu
          mkdir -p wine-headers
          for tree in macos arm64ec; do
            src="third_party/fex64/wine/build-${tree}/include"
            [ -d "$src" ] && cp -R "$src" "wine-headers/${tree}" || true
          done
          du -sh wine-headers/* || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fex64-wine-logs
          path: |
            third_party/fex64/wine/build-*/configure.log
            third_party/fex64/wine/build-*/build.log
          if-no-files-found: ignore

  toolchains:
    name: Cross toolchains for iphoneos
    needs: pins
    # Manual only. A cold run is hours on a macOS runner, which bills at ten
    # times a Linux minute; nobody should trigger that by editing a comment.
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'toolchains'
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Show the build machine
        run: |
          sw_vers
          uname -m
          sysctl -n hw.ncpu
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: brew install ninja cmake

      # Keyed on the lock file: the toolchains are a pure function of the
      # pinned versions, so any change to those - and nothing else - should
      # invalidate hours of work.
      - name: Restore toolchain cache
        id: toolchain-cache
        if: ${{ !inputs.force_rebuild }}
        uses: actions/cache/restore@v4
        with:
          path: third_party/fex64/toolchains
          key: fex64-toolchains-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-toolchains.sh') }}

      - name: Build toolchains
        run: |
          chmod +x scripts/build-fex64-toolchains.sh
          scripts/build-fex64-toolchains.sh --stage all \
            ${{ inputs.force_rebuild && '--force' || '' }}

      - name: Save toolchain cache
        if: always() && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/fex64/toolchains
          key: fex64-toolchains-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-toolchains.sh') }}

      # The LLVM tree is tens of gigabytes of build directory and is not worth
      # carrying; only the artefacts downstream stages consume are published.
      - name: Collect what downstream stages need
        run: |
          set -eu
          staging=fex64-toolchains
          mkdir -p "${staging}"
          cp -R third_party/fex64/toolchains/freetype-ios "${staging}/" || true
          mkdir -p "${staging}/llvm-ios-build"
          cp -R third_party/fex64/toolchains/llvm-ios-build/lib \
                third_party/fex64/toolchains/llvm-ios-build/include \
                "${staging}/llvm-ios-build/" || true
          du -sh "${staging}"/* || true

      - uses: actions/upload-artifact@v4
        with:
          name: fex64-toolchains
          path: fex64-toolchains
          retention-days: 14
          if-no-files-found: error
