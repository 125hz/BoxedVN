name: Build fex64 toolchains

# The fex64 stack cannot be built on a PC, so CI is the only feedback loop
# this branch has. It is deliberately split by cost:
#
#   pins        seconds   - do the pinned commits still exist and check out?
#   toolchains  hours     - llvm-mingw, FreeType and LLVM cross-built for
#                           iphoneos; changes only when the lock file changes,
#                           so it is cached on that file's hash.
#
# Later stages - Wine's macOS and ARM64EC builds, its iphoneos unix side, DXMT,
# FEX, and the unsigned IPA - land here as separate jobs as each recipe is
# established. See docs/ARCHITECTURE_FEX64.md for the order and why.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: How far to go
        required: true
        default: pins
        type: choice
        options:
          - pins
          - fex
          - app
          - wine
          - wine-ios
          - wineboot
          - bringup
          - arm64ec
          - toolchains
      xtajit:
        description: Emulator DLL for the bring-up IPA
        required: false
        default: source
        type: choice
        options:
          - prebuilt
          - source
      wine_core_run_id:
        description: Successful run containing fex64-wine-ios-core (wineboot only)
        required: false
        type: string
      force_rebuild:
        description: Ignore the toolchain cache and rebuild from scratch
        required: false
        default: false
        type: boolean
  push:
    branches:
      - fex64
    paths: &fex64_paths
      - .github/workflows/build-fex64.yml
      - .github/fex64-fetch.sh
      - scripts/common.sh
      - scripts/dependencies.fex64.lock.sh
      - scripts/fetch-fex64-dependencies.sh
      - scripts/build-fex64-toolchains.sh
      - scripts/build-fex64-fex.sh
      - scripts/build-fex64-app.sh
      - scripts/build-fex64-dxmt.sh
      - scripts/build-fex64-wine.sh
      - scripts/build-fex64-wine-ios-core.sh
      - scripts/package-ipa.sh
      - scripts/validate-app.sh
      - ios/fex/**
      - ios/project.yml
      - patches/**
  pull_request:
    branches:
      - fex64
    paths: *fex64_paths

permissions:
  contents: read
  actions: read

concurrency:
  # Keyed by stage as well as branch. One group per branch meant a push
  # cancelled a manually started multi-hour toolchain build, which is the one
  # job on this branch that must never be restarted casually.
  group: build-fex64-${{ github.ref }}-${{ inputs.stage || github.event_name }}
  cancel-in-progress: true

jobs:
  pins:
    name: Pinned sources resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/fetch-fex64-dependencies.sh .github/fex64-fetch.sh

      # Fetching by commit is the whole point of the pin, and it is also the
      # thing that breaks silently when a fork force-pushes. Checking it costs
      # a minute and saves a multi-hour job that would have failed at the end.
      #
      # One step per component, and each one republishes its own failure as an
      # ::error:: annotation. Actions logs need a token to read; annotations do
      # not, so this is what makes a red run diagnosable by anyone looking at
      # the repository rather than only by whoever is signed in.
      - name: Fetch FEX
        if: always()
        run: .github/fex64-fetch.sh fex

      - name: Fetch Wine
        if: always()
        run: .github/fex64-fetch.sh wine

      - name: Fetch DXMT
        if: always()
        run: .github/fex64-fetch.sh dxmt

      - name: Fetch Mythic integration sources
        if: always()
        run: .github/fex64-fetch.sh mythic

      - name: Report what resolved
        run: |
          for component in mythic fex wine dxmt; do
            directory="third_party/fex64/${component}"
            printf '%-6s %s\n' "${component}" \
              "$(git -C "${directory}" rev-parse HEAD)"
          done

  fex:
    name: FEX for iphoneos
    needs: pins
    # Ladder A. Minutes, not hours, and it needs none of the toolchain work -
    # so it runs on every push here, unlike the toolchains job.
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.stage == 'fex'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show the build machine
        run: |
          sw_vers
          uname -m
          sysctl -n hw.ncpu
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: brew install ninja

      - name: Make scripts executable
        run: chmod +x scripts/*.sh .github/*.sh

      - name: Fetch FEX
        run: scripts/fetch-fex64-dependencies.sh --component fex

      - name: Cache the FEX build directory
        uses: actions/cache@v4
        with:
          path: third_party/fex64/fex-build-ios
          key: fex64-fex-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-fex.sh') }}
          restore-keys: fex64-fex-${{ runner.os }}-

      - name: Build FEX
        run: scripts/build-fex64-fex.sh

      - uses: actions/upload-artifact@v4
        with:
          name: fex64-fex-iphoneos
          path: third_party/fex64/fex-ios
          retention-days: 14
          if-no-files-found: error

  app:
    name: fex64 app and unsigned IPA
    needs: fex
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.stage == 'app'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ninja

      - name: Make scripts executable
        run: chmod +x scripts/*.sh .github/*.sh

      - name: Fetch FEX
        run: scripts/fetch-fex64-dependencies.sh --component fex

      # XcodeGen only; the emulator's dependencies are not needed to build this
      # target, and fetching them would add MoltenVK and SDL to a job that
      # links neither.
      - name: Restore third-party cache
        uses: actions/cache@v4
        with:
          path: third_party
          key: fex64-app-${{ runner.os }}-${{ hashFiles('scripts/dependencies.lock.sh', 'scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-fex.sh') }}
          restore-keys: fex64-app-${{ runner.os }}-

      - name: Fetch XcodeGen
        run: scripts/fetch-dependencies.sh --platform ios --configuration Release || true

      - name: Build the app and package the IPA
        run: scripts/build-fex64-app.sh --configuration Release

      - uses: actions/upload-artifact@v4
        with:
          name: fex64-unsigned-ipa
          path: build/fex64-Release/artifacts
          retention-days: 14
          if-no-files-found: error

      - name: Publish the build log when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fex64-app-xcodebuild-log
          path: build/fex64-Release/xcodebuild.log
          if-no-files-found: ignore

  wine:
    name: Wine trees for the fex64 stack
    needs: pins
    # Manual: this is an unestablished recipe and a long build, so it should
    # not run on every push while it is being worked out.
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'wine'
    runs-on: macos-15
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install bison flex mingw-w64 || true
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh .github/*.sh

      - name: Fetch Wine and the pinned runtime
        run: |
          scripts/fetch-fex64-dependencies.sh --component wine
          scripts/fetch-fex64-dependencies.sh --component mythic

      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/fex64/toolchains
          key: fex64-toolchains-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-toolchains.sh') }}
          restore-keys: fex64-toolchains-${{ runner.os }}-

      - name: Make sure llvm-mingw is present
        run: scripts/build-fex64-toolchains.sh --stage llvm-mingw

      - name: Build the Wine trees
        run: scripts/build-fex64-wine.sh --tree all

      - name: Collect the Wine runtime inputs
        run: |
          set -eu
          staging=fex64-wine-runtime
          rm -rf "${staging}"
          mkdir -p "${staging}/headers"
          for tree in macos arm64ec; do
            src="third_party/fex64/wine/build-${tree}/include"
            [ -d "$src" ] && cp -R "$src" "${staging}/headers/${tree}" || true
          done

          runtime=third_party/fex64/mythic/app/Mythic
          for arch in arm64ec aarch64; do
            destination="${staging}/${arch}-windows"
            source="${runtime}/${arch}-windows"
            test -d "${source}" || { echo "the pinned runtime has no ${arch} set" >&2; exit 1; }
            cp -R "${source}" "${destination}"
            count="$(find "${destination}" -type f | wc -l | tr -d ' ')"
            [ "${count}" -gt 0 ] || { echo "no ${arch} PE files were collected" >&2; exit 1; }
            echo "collected ${count} pinned ${arch} PE files"
          done

          for required in ntdll.dll kernel32.dll win32u.dll; do
            test -f "${staging}/arm64ec-windows/${required}" || {
              echo "the runtime artifact is missing ${required}" >&2
              exit 1
            }
          done
          test -f "${staging}/arm64ec-windows/fib-x64.exe" || {
            echo "the runtime artifact is missing the x64 acceptance executable" >&2
            exit 1
          }
          du -sh "${staging}"/*

      - uses: actions/upload-artifact@v4
        with:
          name: fex64-wine-runtime
          path: fex64-wine-runtime
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fex64-wine-logs
          path: |
            third_party/fex64/wine/build-*/configure.log
            third_party/fex64/wine/build-*/build.log
          if-no-files-found: ignore

  wine-ios:
    name: Wine native core for iphoneos
    needs: pins
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'wine-ios'
    runs-on: macos-15
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install bison flex mingw-w64 || true
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh .github/*.sh

      - name: Fetch Wine and its iOS integration sources
        run: |
          scripts/fetch-fex64-dependencies.sh --component wine
          scripts/fetch-fex64-dependencies.sh --component mythic

      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/fex64/toolchains
          key: fex64-toolchains-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-toolchains.sh') }}
          restore-keys: fex64-toolchains-${{ runner.os }}-

      - name: Make sure llvm-mingw is present
        run: scripts/build-fex64-toolchains.sh --stage llvm-mingw

      - name: Generate the Wine trees
        run: scripts/build-fex64-wine.sh --tree all

      - name: Build the native Wine core
        run: scripts/build-fex64-wine-ios-core.sh

      - uses: actions/upload-artifact@v4
        with:
          name: fex64-wine-ios-core
          path: third_party/fex64/wine-ios-core
          retention-days: 14
          if-no-files-found: error

      - name: Publish iPhoneOS compiler errors
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fex64-wine-ios-core-errors
          path: third_party/fex64/wine-ios-core-objects/**/*.err
          if-no-files-found: ignore

  wineboot:
    name: Wine bootstrap app and unsigned IPA
    needs: pins
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'wineboot'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Require the proven Wine artifact runs
        env:
          CORE_RUN: ${{ inputs.wine_core_run_id }}
        run: |
          test -n "${CORE_RUN}" || { echo "wine_core_run_id is required" >&2; exit 1; }

      - name: Install build tools
        run: brew install ninja

      - name: Make scripts executable
        run: chmod +x scripts/*.sh .github/*.sh

      - name: Fetch FEX and the pinned iOS integration
        run: |
          scripts/fetch-fex64-dependencies.sh --component fex
          scripts/fetch-fex64-dependencies.sh --component mythic

      - name: Restore third-party cache
        uses: actions/cache@v4
        with:
          path: third_party
          key: fex64-wineboot-${{ runner.os }}-${{ hashFiles('scripts/dependencies.lock.sh', 'scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-fex.sh') }}
          restore-keys: fex64-wineboot-${{ runner.os }}-

      - name: Fetch XcodeGen
        run: scripts/fetch-dependencies.sh --platform ios --configuration Release || true

      - name: Download the native Wine core
        uses: actions/download-artifact@v4
        with:
          name: fex64-wine-ios-core
          path: build/wine-inputs/core
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.wine_core_run_id }}

      - name: Build the Wine bootstrap app and package the IPA
        run: |
          scripts/build-fex64-app.sh \
            --configuration Release \
            --wine-core-dir build/wine-inputs/core \
            --wine-runtime-dir third_party/fex64/mythic/app/Mythic \
            --mythic-dir third_party/fex64/mythic

      - uses: actions/upload-artifact@v4
        with:
          name: fex64-wineboot-unsigned-ipa
          path: build/fex64-Release/artifacts
          retention-days: 14
          if-no-files-found: error

      - name: Publish the build log when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fex64-wineboot-xcodebuild-log
          path: build/fex64-Release/xcodebuild.log
          if-no-files-found: ignore

  bringup:
    name: Combined Wine bring-up and unsigned IPA
    needs: pins
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'bringup'
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install bison flex mingw-w64 ninja || true
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      # airconv's three shader headers are compiled with the Metal compiler,
      # which recent Xcode ships as a separate download. Settle it in the first
      # minute: the alternative is discovering it after the LLVM build, which is
      # the better part of an hour away.
      - name: Ensure the Metal toolchain is present
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Metal compiler absent; downloading the component"
            xcodebuild -downloadComponent MetalToolchain || true
          fi
          xcrun -sdk macosx metal --version             || { echo "::error::The Metal compiler is unavailable, so DXMT's shader headers cannot be generated."; exit 1; }

      - name: Make scripts executable
        run: chmod +x scripts/*.sh .github/*.sh

      - name: Fetch the complete bring-up source set
        run: |
          scripts/fetch-fex64-dependencies.sh --component wine
          scripts/fetch-fex64-dependencies.sh --component mythic
          scripts/fetch-fex64-dependencies.sh --component fex
          scripts/fetch-fex64-dependencies.sh --component dxmt
          scripts/fetch-dependencies.sh --platform ios --configuration Release || true

      # DXMT's finished archive is cached on its own so a hit needs neither the
      # LLVM source tree nor the LLVM build - the longest item in the project -
      # to be present at all.
      - name: Restore the DXMT unix archive
        id: dxmt-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/fex64/dxmt-ios
          key: fex64-dxmt-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-dxmt.sh') }}

      # build-fex64-dxmt.sh is in this key on purpose. The toolchains cache now
      # has to hold llvm-ios too, and an exact hit on the old key would restore
      # a tree without it and then refuse to save, rebuilding LLVM every single
      # run. Changing the key costs one miss, then it sticks.
      # Restore/save rather than the combined action, with a run-unique key.
      # actions/cache only writes in a post step on success, so the first
      # attempt at llvm-ios threw away 50 minutes of finished libraries when a
      # later target failed. Saving under a fresh key on every run - and
      # restoring the newest matching prefix - lets ninja resume instead.
      #
      # No restore-keys on this one or on DXMT above, unlike the toolchain
      # caches. Those two hold one finished archive and their build scripts
      # short-circuit on the stamp file beside it, so a prefix fallback hands
      # back an archive built from different sources and the script then
      # reports "cached" and skips the rebuild. That is not theoretical: it
      # would have swallowed the win32u symbol renames, since the whole point
      # of putting the script in the key is that changing it forces a rebuild.
      - name: Restore the win32u unix archive
        id: win32u-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/fex64/win32u-ios
          key: fex64-win32u-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-win32u.sh') }}

      - name: Restore cross-toolchain cache
        id: toolchains-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/fex64/toolchains
          key: fex64-toolchains-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-toolchains.sh', 'scripts/build-fex64-dxmt.sh') }}-${{ github.run_id }}
          restore-keys: |
            fex64-toolchains-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-toolchains.sh', 'scripts/build-fex64-dxmt.sh') }}-
            fex64-toolchains-${{ runner.os }}-

      # Only the headers are still needed once llvm-ios is built, but the clone
      # is large enough that re-fetching it dwarfs the restore.
      - name: Restore the LLVM source tree
        id: llvm-src-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/fex64/llvm-project
          key: fex64-llvm-src-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh') }}
          restore-keys: fex64-llvm-src-${{ runner.os }}-

      - name: Restore FEX iPhoneOS build cache
        uses: actions/cache@v4
        with:
          path: third_party/fex64/fex-build-ios
          key: fex64-fex-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-fex.sh') }}
          restore-keys: fex64-fex-${{ runner.os }}-

      # Wine dominates this job: 20 of its 25 minutes, rebuilt from scratch
      # every run while the toolchains and the FEX build are already cached.
      # The tree is deterministic given the pin, and both configure and make
      # are skipped when it is restored intact.
      - name: Restore the Wine trees
        uses: actions/cache@v4
        with:
          path: third_party/fex64/wine
          key: fex64-wine-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-wine.sh') }}
          restore-keys: fex64-wine-${{ runner.os }}-

      - name: Build the ARM64EC emulator DLL from source
        if: inputs.xtajit == 'source'
        run: scripts/build-fex64-arm64ec.sh

      - name: Build Wine, its iPhoneOS core, and the app in one run
        run: |
          if [ "${{ inputs.xtajit }}" = "source" ]; then
            export BOXEDVN_XTAJIT_DLL="$PWD/third_party/fex64/arm64ec-fex/libarm64ecfex.dll"
          fi
          scripts/build-fex64-toolchains.sh --stage llvm-mingw
          # Skip LLVM entirely when the DXMT archive is already built and
          # verified: it is the only consumer, and building it takes longer than
          # everything else in this job put together.
          #
          # The test is the stamp, not just the archive, so it matches
          # build-fex64-dxmt.sh's own cache condition exactly. Those two drifted
          # apart once already: a run cached an archive whose verification had
          # failed, leaving a file with no stamp, so this guard called it done
          # while the script rebuilt it.
          dxmt_dir="$PWD/third_party/fex64/dxmt-ios"
          dxmt_lib="$dxmt_dir/libdxmt_combined.a"
          if [ ! -f "$dxmt_dir/.stamp" ] || [ ! -f "$dxmt_lib" ]; then
            scripts/build-fex64-toolchains.sh --stage llvm-ios
          fi
          scripts/build-fex64-dxmt.sh
          scripts/build-fex64-wine.sh --tree all
          scripts/build-fex64-toolchains.sh --stage freetype
          scripts/build-fex64-win32u.sh
          scripts/build-fex64-wine-ios-core.sh
          scripts/build-fex64-app.sh \
            --configuration Release \
            --wine-core-dir third_party/fex64/wine-ios-core \
            --wine-runtime-dir third_party/fex64/mythic/app/Mythic \
            --mythic-dir third_party/fex64/mythic \
            --wine-pe-dir third_party/fex64/wine/build-arm64ec \
            --dxmt-lib "$dxmt_lib"             --win32u-lib "$PWD/third_party/fex64/win32u-ios/libwin32u_unix.a"

      # if: always() is the whole point: the run this was written for failed
      # with 1656 of 1674 LLVM targets built.
      - name: Save cross-toolchain cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: third_party/fex64/toolchains
          key: fex64-toolchains-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-toolchains.sh', 'scripts/build-fex64-dxmt.sh') }}-${{ github.run_id }}

      - name: Save the LLVM source tree
        if: always() && steps.llvm-src-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: third_party/fex64/llvm-project
          key: fex64-llvm-src-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh') }}

      - name: Save the win32u unix archive
        if: always() && steps.win32u-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: third_party/fex64/win32u-ios
          key: fex64-win32u-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-win32u.sh') }}

      - name: Save the DXMT unix archive
        if: always() && steps.dxmt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: third_party/fex64/dxmt-ios
          key: fex64-dxmt-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-dxmt.sh') }}

      # A device fault reports an offset into the emulator and nothing else,
      # and the map that resolves one is written on the runner and thrown away
      # with it. Kept separate from the IPA artifact so it is diagnostic data
      # rather than something to install.
      - name: Publish the emulator symbol map
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fex64-arm64ecfex-symbols
          path: third_party/fex64/arm64ec-fex/libarm64ecfex.symbols
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: fex64-bringup-unsigned-ipa
          path: build/fex64-Release/artifacts
          retention-days: 14
          if-no-files-found: error

      - name: Publish combined-build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fex64-bringup-build-diagnostics
          path: |
            third_party/fex64/wine-ios-core-objects/**/*.err
            third_party/fex64/dxmt-ios/obj/*.err
            third_party/fex64/win32u-ios/obj/*.err
            third_party/fex64/wine/build-*/configure.log
            third_party/fex64/wine/build-*/build.log
            build/fex64-Release/xcodebuild.log
          if-no-files-found: ignore

  arm64ec:
    name: ARM64EC emulator DLL from source
    needs: pins
    # Manual only, and deliberately independent of the bring-up job: the app
    # keeps using the prebuilt DLL until a source-built one is proven on device.
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'arm64ec'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ninja

      - name: Make scripts executable
        run: chmod +x scripts/*.sh .github/*.sh

      - name: Fetch the pinned FEX source
        run: scripts/fetch-fex64-dependencies.sh --component fex

      - name: Restore cross-toolchain cache
        uses: actions/cache@v4
        with:
          path: third_party/fex64/toolchains
          key: fex64-toolchains-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-toolchains.sh') }}
          restore-keys: fex64-toolchains-${{ runner.os }}-

      - name: Install llvm-mingw
        run: scripts/build-fex64-toolchains.sh --stage llvm-mingw

      - name: Report the toolchain targets
        run: ls third_party/fex64/toolchains/*/bin | grep -E 'clang$' | sort

      - name: Build the ARM64EC emulator DLL
        run: scripts/build-fex64-arm64ec.sh

      - name: Describe the resulting PE
        run: |
          ls -l third_party/fex64/arm64ec-fex/
          shasum -a 256 third_party/fex64/arm64ec-fex/libarm64ecfex.dll

      - uses: actions/upload-artifact@v4
        with:
          name: fex64-arm64ec-dll
          path: third_party/fex64/arm64ec-fex
          retention-days: 14
          if-no-files-found: error


  toolchains:
    name: Cross toolchains for iphoneos
    needs: pins
    # Manual only. A cold run is hours on a macOS runner, which bills at ten
    # times a Linux minute; nobody should trigger that by editing a comment.
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'toolchains'
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Show the build machine
        run: |
          sw_vers
          uname -m
          sysctl -n hw.ncpu
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: brew install ninja cmake

      # Keyed on the lock file: the toolchains are a pure function of the
      # pinned versions, so any change to those - and nothing else - should
      # invalidate hours of work.
      - name: Restore toolchain cache
        id: toolchain-cache
        if: ${{ !inputs.force_rebuild }}
        uses: actions/cache/restore@v4
        with:
          path: third_party/fex64/toolchains
          key: fex64-toolchains-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-toolchains.sh') }}

      - name: Build toolchains
        run: |
          chmod +x scripts/build-fex64-toolchains.sh
          scripts/build-fex64-toolchains.sh --stage all \
            ${{ inputs.force_rebuild && '--force' || '' }}

      - name: Save toolchain cache
        if: always() && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/fex64/toolchains
          key: fex64-toolchains-${{ runner.os }}-${{ hashFiles('scripts/dependencies.fex64.lock.sh', 'scripts/build-fex64-toolchains.sh') }}

      # The LLVM tree is tens of gigabytes of build directory and is not worth
      # carrying; only the artefacts downstream stages consume are published.
      - name: Collect what downstream stages need
        run: |
          set -eu
          staging=fex64-toolchains
          mkdir -p "${staging}"
          cp -R third_party/fex64/toolchains/freetype-ios "${staging}/" || true
          mkdir -p "${staging}/llvm-ios-build"
          cp -R third_party/fex64/toolchains/llvm-ios-build/lib \
                third_party/fex64/toolchains/llvm-ios-build/include \
                "${staging}/llvm-ios-build/" || true
          du -sh "${staging}"/* || true

      - uses: actions/upload-artifact@v4
        with:
          name: fex64-toolchains
          path: fex64-toolchains
          retention-days: 14
          if-no-files-found: error
