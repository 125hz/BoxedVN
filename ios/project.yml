# BoxedVN - XcodeGen specification for the application shell.
#
# Copyright (C) 2026  The BoxedWine Team.  GPLv2; see license.txt.
#
# CMake builds all of the C/C++/Objective-C++ into one static archive
# (libboxedvn.a).  This spec describes only the Swift application that links
# it.  The generated .xcodeproj is disposable and is not committed; run
# scripts/build-ios.sh, which regenerates it every time.
#
# Paths are relative to this file (the `ios` directory).

name: BoxedVN

options:
  bundleIdPrefix: org.boxedwine
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  # Deterministic output: no Xcode-version-dependent defaults leak in.
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "131"
    # Overridden by scripts/build-ios.sh with the real git commit.  The
    # default is deliberately "unknown" so a build produced any other way
    # says so instead of claiming a revision it does not have.
    BVN_BUILD_REVISION: "unknown"
    ENABLE_BITCODE: NO
    # The app is a thin shell over the static archive; there is nothing to
    # strip that would help, and keeping symbols makes device crash logs
    # readable without a dSYM lookup.
    STRIP_INSTALLED_PRODUCT: NO
    ONLY_ACTIVE_ARCH: NO
    ARCHS: arm64
    VALID_ARCHS: arm64
    # BoxedVN targets physical ARM64 devices; the emulator's JIT cannot run on
    # a simulator anyway.
    SUPPORTED_PLATFORMS: iphoneos
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  BoxedVN:
    type: application
    platform: iOS
    sources:
      - path: app/Sources
      - path: app/Resources
        optional: true
        buildPhase: resources
      # Populated by scripts/fetch-rootfs.sh when BOXEDVN_BUNDLE_ROOTFS is on.
      # Optional so a clean clone builds without the multi-hundred-megabyte
      # root filesystem archive.
      - path: app/Bundled
        optional: true
        buildPhase: resources
      # Patched DXVK, kept as a folder reference so the DLLs stay inside a
      # Dxvk/ subdirectory in the bundle rather than being flattened into the
      # bundle root next to unrelated resources.
      - path: app/Dxvk
        optional: true
        type: folder
        buildPhase: resources
      - path: ../THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: ../third_party/src/MoltenVK-ios-1.4.2/LICENSE
        buildPhase: resources
    # No `info:` or `entitlements:` blocks here on purpose.  Those make
    # XcodeGen *generate* the files at those paths, silently overwriting the
    # hand-written ones on every run.  Pointing the build settings at the
    # checked-in files instead keeps them under our control.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.boxedwine.boxedvn
        PRODUCT_NAME: BoxedVN
        INFOPLIST_FILE: app/Info.plist
        # app/Resources/Assets.xcassets holds AppIcon, drawn by
        # scripts/make-app-icon.swift.  A single 1024x1024 universal entry is
        # all iOS 17+ needs; the system derives every other size.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: app/BoxedVN.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: app/BoxedVN-Bridging-Header.h
        # BVN_LIBRARY_DIR and BVN_INCLUDE_DIR are passed in by
        # scripts/build-ios.sh so the CMake build directory is not hard-coded.
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(BVN_INCLUDE_DIR)
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(BVN_LIBRARY_DIR)
        OTHER_LDFLAGS:
          - $(inherited)
          - -lboxedvn
          - -lc++
          # libboxedvn.a contains BVNAppDelegate, which nothing references by
          # symbol - SDL looks it up by name at runtime - so the linker would
          # otherwise drop it.  ObjC keeps every Objective-C class; all_load
          # is not needed and would bloat the binary.
          - -ObjC
          # MoltenVK is discovered by SDL with dlsym(RTLD_DEFAULT), so force
          # its loader entry point out of the merged static archive.
          - -Wl,-u,_vkGetInstanceProcAddr
        CLANG_ENABLE_MODULES: YES
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        # Sideloading tools re-sign the IPA, so CI produces it unsigned.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    dependencies:
      # Frameworks the merged archive needs.  CMake links these for its own
      # targets, but a static archive carries no link dependencies, so the
      # application target has to name them again.
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudio.framework
      # SDL2's HIDAPI backend (src/hidapi/ios/hid.m) talks to Steam
      # Controllers over BLE and references CBCentralManager.
      - sdk: CoreBluetooth.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreMotion.framework
      - sdk: Foundation.framework
      - sdk: GameController.framework
      - sdk: ImageIO.framework
      - sdk: IOSurface.framework
      - sdk: Metal.framework
      - sdk: OpenGLES.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: libc++.tbd
      - sdk: libiconv.tbd

  # The fex64 stack: a second application, not a mode of the first. It shares
  # no runtime with the emulator - different CPU, different Windows layer,
  # different graphics path - and the one thing it does share, the executable
  # arena, it compiles from the same sources rather than copying.
  #
  # Its archives come from scripts/build-fex64-fex.sh, which is a separate
  # build from CMake's; BVN_FEX_LIBRARY_DIR and BVN_FEX_INCLUDE_DIR are passed
  # in by scripts/build-fex64-app.sh.
  BoxedVNFex:
    type: application
    platform: iOS
    sources:
      - path: fex/app
      - path: fex/runtime/aarch64-windows
        optional: true
        type: folder
        buildPhase: resources
      - path: fex/runtime/arm64ec-windows
        optional: true
        type: folder
        buildPhase: resources
      - path: fex/runtime/i386-windows
        optional: true
        type: folder
        buildPhase: resources
      - path: fex/runtime/nls
        optional: true
        type: folder
        buildPhase: resources
      - path: fex/runtime/prefix-template
        optional: true
        type: folder
        buildPhase: resources
      - path: runtime/src/BVNExecMemory.cpp
      - path: runtime/src/BVNJitArenaPlan.cpp
      - path: runtime/src/BVNRangeAllocator.cpp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.boxedwine.boxedvn.fex
        PRODUCT_NAME: BoxedVNFex
        INFOPLIST_FILE: fex/app/Info.plist
        CODE_SIGN_ENTITLEMENTS: fex/app/BoxedVNFex.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: fex/app/BoxedVNFex-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/runtime/include
          - $(SRCROOT)/runtime/src
          - $(BVN_FEX_INCLUDE_DIR)
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(BVN_FEX_LIBRARY_DIR)
          - $(BVN_WINE_LIBRARY_DIR)
        # FEXCore is C++20 and its headers are included directly here.
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        CLANG_CXX_LIBRARY: "libc++"
        OTHER_LDFLAGS:
          - $(inherited)
          # A 32-bit Windows guest's pointers are 32 bits, so every image,
          # heap and stack WoW64 gives it has to sit below 4 GiB - and a
          # 64-bit Mach-O reserves exactly that range as __PAGEZERO unless it
          # is told otherwise. Shrink it to one page so the range is free.
          #
          # This is the one change here that can stop the app launching at
          # all, because whether iOS will load a binary with a non-default
          # __PAGEZERO is not documented and has not been tested on this
          # project before. If the app does not start after this, remove
          # these two lines and the x86-64 stack is exactly as it was; the
          # 32-bit side then needs a different answer. The FEX bridge reports
          # what it actually got ("low address space:" in the session log),
          # so a launch that succeeds also says whether this worked.
          - -Wl,-pagezero_size,0x4000
          # Order matters for static archives: FEXCore first, then what it
          # draws on.
          - -lFEXCore
          - -lFEXCore_Base
          - -lJemallocLibs
          - -lfmt
          - -lxxhash
          - -lsoftfloat_3e
          - -lcephes_128bit
          - -lc++
          - $(BVN_WINE_LDFLAGS)
          # DXMT's unix side, by absolute path and last: it resolves against
          # Wine's ntdll_unix and carries its own LLVM, so it has to come
          # after both. Empty unless the app build was given --dxmt-lib.
          - $(BVN_DXMT_LDFLAGS)
        CLANG_ENABLE_MODULES: YES
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: Foundation.framework
      - sdk: IOKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      # DXMT's unix side reaches past Metal itself: CGColorSpace for swapchain
      # colour handling, IOSurface for shared texture backing, and MetalFX for
      # its spatial and temporal upscalers - the two MTLFX*ScalerDescriptor
      # classes were the only symbols missing from the first link that carried
      # the archive. Its shader cache is SQLite. All harmless when the archive
      # is not linked.
      - sdk: CoreGraphics.framework
      - sdk: IOSurface.framework
      - sdk: MetalFX.framework
      - sdk: ImageIO.framework
      - sdk: libc++.tbd
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd

schemes:
  BoxedVN:
    build:
      targets:
        BoxedVN: all
    run:
      config: Debug
    archive:
      config: Release
  BoxedVNFex:
    build:
      targets:
        BoxedVNFex: all
    run:
      config: Debug
    archive:
      config: Release
